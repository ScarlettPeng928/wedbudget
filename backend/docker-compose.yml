# SQL Server 2022 for local development.
# Start: docker compose up -d    Stop: docker compose down
# The password comes from MSSQL_SA_PASSWORD in .env (same folder).
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: wedbudget-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      # Keeps the data when the container is removed or recreated.
      - wedbudget-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  wedbudget-db-data:
